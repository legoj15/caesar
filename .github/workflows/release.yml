name: Release

# On a version tag (v*), build the binary on every hosted OS, zip each one, and
# publish a single GitHub Release with all three archives attached.

on:
  push:
    tags: ['v*']

# Least-privilege default; only the publish job re-grants contents: write.
permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.asset }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: caesar-windows-x64
            bin: build/Release/caesar.exe   # VS multi-config: --config selects Release
          - os: ubuntu-latest
            asset: caesar-linux-x64
            bin: build/caesar                # Unix Makefiles: single-config
          - os: macos-latest
            asset: caesar-macos-arm64
            bin: build/caesar                # macos-latest is arm64 (Apple Silicon)

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      # Stage the binary alongside the licence + readme, then zip the folder so
      # every archive expands to a single caesar-<os>-<arch>/ directory.
      - name: Package (Unix)
        if: runner.os != 'Windows'
        env:
          BIN: ${{ matrix.bin }}
          ASSET: ${{ matrix.asset }}
        run: |
          mkdir -p "dist/$ASSET/licenses"
          cp "$BIN" "dist/$ASSET/"
          cp LICENSE README.md CHANGELOG.md "dist/$ASSET/"
          cp src/libsmfc/LICENSE "dist/$ASSET/licenses/libsmfc-LICENSE.txt"
          cp src/sf2cute-0.2/LICENSE "dist/$ASSET/licenses/sf2cute-LICENSE.txt"
          (cd dist && zip -r "$ASSET.zip" "$ASSET")

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          BIN: ${{ matrix.bin }}
          ASSET: ${{ matrix.asset }}
        run: |
          New-Item -ItemType Directory -Force "dist/$env:ASSET/licenses" | Out-Null
          Copy-Item "$env:BIN" "dist/$env:ASSET/"
          Copy-Item LICENSE, README.md, CHANGELOG.md "dist/$env:ASSET/"
          Copy-Item src/libsmfc/LICENSE "dist/$env:ASSET/licenses/libsmfc-LICENSE.txt"
          Copy-Item src/sf2cute-0.2/LICENSE "dist/$env:ASSET/licenses/sf2cute-LICENSE.txt"
          Compress-Archive -Path "dist/$env:ASSET" -DestinationPath "dist/$env:ASSET.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    # Only this job writes: it creates the Release and uploads assets.
    permissions:
      contents: write
    steps:
      - name: Checkout (for CHANGELOG.md)
        uses: actions/checkout@v5

      - name: Extract this release's changelog section
        # The first VERSION section ("## [<digit>...") of CHANGELOG.md is the
        # release being cut — the convention rotates [Unreleased] to the
        # version + date (and starts a fresh empty [Unreleased] above it)
        # before the tag is pushed. Matching the digit skips that empty
        # [Unreleased] header, which the old "first ## [ section" form would
        # have published as an empty body. GitHub appends the auto-generated
        # notes after this body.
        run: awk '/^## \[[0-9]/{n++} n==1' CHANGELOG.md > release-body.md

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: List gathered assets
        run: ls -R artifacts

      - name: Publish release
        # Pinned to the commit v3.0.1 points at (this job holds contents: write).
        # Dependabot (.github/dependabot.yml) bumps this via reviewable PRs.
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          files: artifacts/*.zip
          body_path: release-body.md
          generate_release_notes: true
          fail_on_unmatched_files: true
